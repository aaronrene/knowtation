openapi: 3.0.3
info:
  title: Knowtation Hub API
  description: REST API for the Knowtation Hub (vault read/write, proposals, capture). Same contract as CLI/MCP where applicable.
  version: 1.0.0
  links:
    - description: API contract (human-readable)
      url: ./HUB-API.md

servers:
  - url: /api/v1
    description: Relative to Hub base URL (e.g. https://hub.example.com)

tags:
  - name: Health
  - name: Auth
  - name: Notes
  - name: Search
  - name: Proposals
  - name: Capture
  - name: Flows
  - name: Tasks
  - name: Attachments

security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Hub is up
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } }, required: [ok] }

  /auth/agent/credentials:
    post:
      tags: [Auth]
      summary: Phase C — mint scoped REST agent credential (secret once)
      description: |
        Requires a human session JWT. Returns opaque `kt_agent_<id>.<secret>` once.
        Default scopes: propose + vault:read. No admin scopes.
      responses:
        '201':
          description: Credential minted
        '401':
          description: Unauthorized
        '409':
          description: Credential limit
    get:
      tags: [Auth]
      summary: Phase C — list agent credentials (metadata only)
      responses:
        '200':
          description: Credential list without secrets
  /auth/agent/credentials/{id}:
    delete:
      tags: [Auth]
      summary: Phase C — revoke agent credential
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Revoked (idempotent)
  /auth/agent/credentials/{id}/rotate:
    post:
      tags: [Auth]
      summary: Phase C — rotate agent credential secret (shown once)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: New secret issued
  /auth/agent/token:
    post:
      tags: [Auth]
      summary: Phase C — exchange kt_agent_ credential for agent_access JWT
      security: []
      responses:
        '200':
          description: Access token issued
        '401':
          description: Invalid credential
        '503':
          description: Store unavailable

  /api/v1/auth/session:
    get:
      tags: [Auth]
      summary: C7 Session introspection — current identity and scopes
      description: |
        Returns the verified identity and derived API scopes for the caller. Accepts only a
        `Bearer` JWT in the `Authorization` header — no cookie required, making it safe to call
        cross-origin from Scooling or any other consumer.

        The response is derived entirely from the signed token — no database call is made.
        Scopes are role-derived today (C4 will replace this with per-user explicit grants without
        changing the response shape).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verified session
          content:
            application/json:
              schema:
                type: object
                required: [sub, provider, id, name, role, iat, exp, scopes]
                properties:
                  sub:
                    type: string
                    description: Canonical user ID (`provider:id`)
                    example: google:104164334692309763642
                  provider:
                    type: string
                    enum: [google, github]
                  id:
                    type: string
                    description: Provider-specific user ID
                  name:
                    type: string
                    description: Display name (empty for refresh-path tokens)
                  role:
                    type: string
                    enum: [admin, member]
                  iat:
                    type: integer
                    description: Token issued-at (Unix seconds)
                  exp:
                    type: integer
                    description: Token expires-at (Unix seconds)
                  scopes:
                    type: array
                    items: { type: string }
                    description: Derived API scopes. `admin` role → `[vault:read, vault:write, admin]`; `member` → `[vault:read, vault:write]`
                    example: [vault:read, vault:write]
        '401':
          description: Missing, expired, or tampered token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [UNAUTHORIZED] }

  /auth/providers:
    get:
      tags: [Auth]
      summary: OAuth providers configured
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  google: { type: boolean }
                  github: { type: boolean }

  /notes/facets:
    get:
      tags: [Notes]
      summary: Projects, tags, folders for filter dropdowns
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects: { type: array, items: { type: string } }
                  tags: { type: array, items: { type: string } }
                  folders: { type: array, items: { type: string } }

  /notes:
    get:
      tags: [Notes]
      summary: List notes
      parameters:
        - name: folder
          in: query
          schema: { type: string }
        - name: project
          in: query
          schema: { type: string }
        - name: tag
          in: query
          schema: { type: string }
        - name: since
          in: query
          schema: { type: string }
        - name: until
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 0, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
        - name: order
          in: query
          schema: { type: string, enum: [date, date-asc] }
        - name: fields
          in: query
          schema: { type: string, enum: [path, path+metadata, full] }
        - name: count_only
          in: query
          schema: { type: boolean }
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      notes: { type: array, items: { $ref: '#/components/schemas/NoteListItem' } }
                      total: { type: integer }
                  - type: object
                    properties:
                      total: { type: integer }
    post:
      tags: [Notes]
      summary: Write or update a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
                body: { type: string }
                frontmatter: { type: object }
                append: { type: boolean }
      responses:
        '200':
          content:
            application/json:
              schema: { type: object, properties: { path: { type: string }, written: { type: boolean } } }
        '400':
        '500':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /notes/{path}:
    get:
      tags: [Notes]
      summary: Get one note by path
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteFull' }
        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /note-outline:
    get:
      tags: [Notes]
      summary: Body-free NoteOutline headings for one note
      description: >
        Returns knowtation.note_outline/v1 metadata for one authorized vault-relative note.
        The response excludes note body text, snippets, full frontmatter, absolute paths,
        provider payloads, MCP resource URIs, summaries, vectors, OCR, PageIndex output,
        persistence records, and write-back state.
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: Vault-relative Markdown note path.
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteOutline' }
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /document-tree:
    get:
      tags: [Notes]
      summary: Body-free DocumentTree heading hierarchy for one note
      description: >
        Returns knowtation.document_tree/v0 metadata for one authorized vault-relative note.
        The response excludes note body text, snippets, full frontmatter, absolute paths,
        provider payloads, MCP resource URIs, summaries, vectors, OCR, PageIndex output,
        persistence records, sidecars, LLM calls, and write-back state.
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: Vault-relative Markdown note path.
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTree' }
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /calendar/timeline:
    get:
      tags: [Calendar]
      summary: Merged note-date and external-event timeline (self-hosted)
      description: >
        Returns knowtation.calendar_timeline/v0 items for an authorized vault.
        Merges note-date buckets and stored calendar events. No OAuth tokens or connector secrets.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
          description: Range start (YYYY-MM-DD or ISO8601).
        - name: to
          in: query
          required: true
          schema: { type: string }
          description: Range end (YYYY-MM-DD or ISO8601).
        - name: layers
          in: query
          required: false
          schema: { type: string }
          description: Comma-separated layers (`notes`, `events`). Default both.
        - name: source_calendar_ids
          in: query
          required: false
          schema: { type: string }
          description: Comma-separated source calendar ids to include for the events layer.
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarTimeline' }
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /calendar/agent-context:
    get:
      tags: [Calendar]
      summary: Tier-enforced calendar context for agents (self-hosted)
      description: >
        Returns knowtation.calendar_agent_context/v0 — redacted calendar events an agent
        may see. Enforced server-side: calendars with enabled_for_agents=false contribute
        nothing; per-calendar agent_context_tier_max and the org policy cap clamp the tier;
        the v0 retrieval ceiling is tier 2. Agent visibility is independent of
        enabled_for_display. Tier 1 omits the event summary; tier 0 returns no events.
        Calendar text is untrusted prompt content.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
          description: Range start (YYYY-MM-DD or ISO8601).
        - name: to
          in: query
          required: true
          schema: { type: string }
          description: Range end (YYYY-MM-DD or ISO8601).
        - name: agent_context_tier
          in: query
          required: true
          schema: { type: integer, minimum: 0, maximum: 2 }
          description: Requested agent tier (0 none, 1 busy blocks, 2 titles + label). Clamped by caps.
        - name: source_calendar_ids
          in: query
          required: false
          schema: { type: string }
          description: Comma-separated source calendar ids to restrict the agent scope.
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarAgentContext' }
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /calendar/source-calendars:
    get:
      tags: [Calendar]
      summary: List source calendars and display/agent toggles (self-hosted)
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceCalendarList' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /calendar/source-calendars/{id}:
    patch:
      tags: [Calendar]
      summary: Update source calendar display/agent toggles (self-hosted)
      description: >
        Partial update for enabled_for_display, enabled_for_agents, agent_context_tier_max (0–4),
        and optional user_group. Org policy may cap agent_context_tier_max via
        KNOWTATION_CALENDAR_AGENT_TIER_MAX_CAP or data/hub_calendar_policy.json.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Source calendar id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceCalendarPatchRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceCalendarPatchResult' }
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /calendar/events/import:
    post:
      tags: [Calendar]
      summary: Import ICS text into the local event store (read-only, self-hosted)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalendarIcsImportRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarIcsImportResult' }
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /flows:
    get:
      tags: [Flows]
      summary: List scope-visible flows (content-minimized)
      description: >
        Returns knowtation.flow_list/v0 summaries for flows visible in the caller's
        authorized workspace scope. Scope query param narrows only — never widens.
        Step bodies are never included in list responses.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [personal, project, org] }
          description: Narrow within authorized scopes only.
        - name: tag
          in: query
          schema: { type: string }
          description: Filter by single tag membership.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
          description: Max summaries (default 200).
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowListResponse' }
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [Flows]
      summary: Propose a new Flow (review-before-write)
      description: >
        Validates a knowtation.flow/v0 + flow_step/v0 bundle, resolves write
        authority server-side (scope × role, deny-by-default), and creates a
        standard proposal targeting the Flow's mirror note (SD-4). Returns a
        knowtation.flow_proposal/v0 envelope (pointers/labels only). Gated by
        FLOW_AUTHORING_WRITES — when off returns 403 FLOW_AUTHORING_DISABLED.
        No Flow index write happens here; the index changes only at approve→apply.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlowProposeRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowProposalResponse' }
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /flows/import:
    post:
      tags: [Flows]
      summary: Import a portable Flow bundle as a scope-checked proposal
      description: >
        Routes a portable { flow, steps } bundle through the same propose path.
        The bundle scope is validated against the actor's write tier; unwritable
        ⇒ 403 FLOW_IMPORT_SCOPE_DENIED, malformed ⇒ 400 FLOW_IMPORT_BUNDLE_MALFORMED.
        Lineage pointers (external_ref / source_vault_hint) are preserved. Never
        auto-applied — creates a proposed proposal. Gated by FLOW_AUTHORING_WRITES.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlowImportRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowProposalResponse' }
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /flows/capture/observe:
    post:
      tags: [Flows]
      summary: Observe content-minimized session signals (capture detection)
      description: >
        Runs bounded structural detectors when FLOW_CAPTURE_DETECTION_ENABLED is on.
        Creates/updates flow_candidate/v0 records; returns content-minimized summaries.
        When detection is off, returns detection_authorized=false with no store mutation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, step_sequence_refs, observed_counts]
      responses:
        '200':
          description: Observe envelope
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /flows/candidates:
    get:
      tags: [Flows]
      summary: List flow capture candidates (read store)
      description: Returns pending_review candidate summaries; read path does not require detection sub-gate.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [personal, project, org] }
        - name: include_low_confidence
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: Candidate list envelope
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /flows/candidates/{candidate_id}/propose:
    post:
      tags: [Flows]
      summary: Propose candidate promotion (review-before-write)
      description: >
        Creates a flow_candidate_promote or flow_candidate_merge proposal.
        Gated by FLOW_CAPTURE_WRITES_ENABLED (default off).
      parameters:
        - name: candidate_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed_scope, intent]
      responses:
        '201':
          description: Capture proposal envelope
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /flows/candidates/{candidate_id}/dismiss:
    post:
      tags: [Flows]
      summary: Propose candidate dismissal
      description: >
        Creates a flow_candidate_dismiss proposal; on approve candidate status becomes rejected.
        Gated by FLOW_CAPTURE_WRITES_ENABLED (default off).
      parameters:
        - name: candidate_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent]
      responses:
        '201':
          description: Capture proposal envelope
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /flows/{id}/proposals:
    post:
      tags: [Flows]
      summary: Propose an edit to an existing Flow (review-before-write)
      description: >
        Like POST /flows but for an edit. Requires base_version + base_state_id
        (the flowst1_ optimistic-concurrency token); a mismatch at propose or
        approve time ⇒ 409 FLOW_LINEAGE_CONFLICT. flow.version must be strictly
        greater than base_version. Editing a flow the actor cannot read ⇒ 404
        unknown_flow (no existence leak). Gated by FLOW_AUTHORING_WRITES.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Flow id (flow_<slug>); must match the bundle's flow_id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlowProposeEditRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowProposalResponse' }
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /flows/{id}/projection:
    get:
      tags: [Flows]
      summary: Derive a read-only harness projection of a canonical flow
      description: >
        Renders the canonical flow (latest visible, or pinned ?version) into the requested
        harness as knowtation.flow_project/v0. Derived and read-only — generated_from_canonical
        is always true and editable is always false. No secrets appear in rendered text.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: harness
          in: query
          required: true
          schema:
            type: string
            enum: [cursor_rule, cursor_skill, mcp_prompt, cli_runbook, agent_bundle]
        - name: version
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowProjectResponse' }
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /flows/{id}/external-grants:
    post:
      tags: [Flows]
