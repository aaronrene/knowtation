    get:
      tags: [Attachments]
      summary: List scope-visible attachments (content-minimized)
      description: >
        Returns knowtation.attachment_list/v0 summaries for attachments visible in
        the caller's authorized workspace scope. Scope query param narrows only — never widens.
        List responses never include linked_note_refs, byte_size, mime_type, or agent_visible.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [personal, project, org] }
          description: Narrow within authorized scopes only.
        - name: note_ref
          in: query
          schema: { type: string }
          description: Filter attachments linked to a specific note (note:path).
        - name: source
          in: query
          schema:
            type: string
            enum: [vault_file, mist_blob, embedded_url, connector_ref]
        - name: mime_class
          in: query
          schema:
            type: string
            enum: [image, video, audio, document, unknown]
        - name: storage_kind
          in: query
          schema:
            type: string
            enum: [vault_blob, external_link]
        - name: agent_visible
          in: query
          schema: { type: boolean }
          description: When true, return only attachments with agent_visible consent.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
          description: Max summaries (default 500).
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentListResponse' }
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

