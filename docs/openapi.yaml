          description: Flow id (flow_<slug>).
        - name: version
          in: query
          schema: { type: string }
          description: Pin semver version; default latest visible.
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowGetResponse' }
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

