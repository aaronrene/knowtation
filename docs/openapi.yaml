      summary: List scope-visible tasks (content-minimized)
      description: >
        Returns knowtation.task_list/v0 summaries for tasks visible in the caller's
        authorized workspace scope. Scope query param narrows only — never widens.
        List responses never include assignee refs or artifact_links.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [personal, project, org] }
          description: Narrow within authorized scopes only.
        - name: workspace_id
          in: query
          schema: { type: string }
          description: Filter by workspace_id equality.
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_progress, blocked, done, cancelled]
        - name: kind
          in: query
          schema:
            type: string
            enum: [personal, assignment, mentor_checkin, org_work_job]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
          description: Max summaries (default 500).
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListResponse' }
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tasks/{id}:
    get:
