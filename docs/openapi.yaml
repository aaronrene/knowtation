      properties:
        schema:
          type: string
          enum: [knowtation.flow_project/v0]
        vault_id: { type: string }
        projection: { $ref: '#/components/schemas/FlowProjection' }
        staleness: { $ref: '#/components/schemas/FlowProjectionStaleness' }
        generator: { $ref: '#/components/schemas/FlowProjectionGenerator' }

    FlowProjection:
      type: object
      required: [schema, flow_id, flow_version, harness, rendered, generated_from_canonical, editable]
      properties:
        schema:
          type: string
          enum: [knowtation.flow_projection/v0]
        flow_id: { type: string }
        flow_version: { type: string }
        harness:
          type: string
          enum: [cursor_rule, cursor_skill, mcp_prompt, cli_runbook, agent_bundle]
        rendered:
          type: string
          maxLength: 65536
        generated_from_canonical:
          type: boolean
          enum: [true]
        editable:
          type: boolean
          enum: [false]
        fidelity:
          type: object
          required: [dropped_fields]
          properties:
            dropped_fields:
              type: array
              items: { type: string }
            notes: { type: string }

    FlowProjectionStaleness:
      type: object
      required: [stale, projection_version, latest_version]
      properties:
        stale: { type: boolean }
        projection_version: { type: string }
        latest_version: { type: string }

    FlowProjectionGenerator:
      type: object
      required: [generator_version, content_hash, generated_at]
      properties:
        generator_version: { type: string }
        content_hash: { type: string }
        generated_at: { type: string }

    Flow:
      type: object
      required: [schema, flow_id, title, version, scope, summary, steps, updated, truncated]
      properties:
        schema:
          type: string
          enum: [knowtation.flow/v0]
        flow_id: { type: string }
        title: { type: string }
        version: { type: string }
        scope:
          type: string
          enum: [personal, project, org]
        summary: { type: string }
        tags:
          type: array
          maxItems: 32
          items: { type: string }
        steps:
          type: array
          maxItems: 100
          items: { type: string }
        inputs:
          type: array
          items:
            type: object
            required: [name, type, required]
            properties:
              name: { type: string }
              type: { type: string }
              required: { type: boolean }
        vault_mirror_path: { type: string, nullable: true }
        updated: { type: string }
        truncated: { type: boolean }

    FlowStep:
      type: object
      required: [schema, step_id, flow_id, ordinal, owned_job, instruction, trigger, when_not_to_run, boundaries, output_shape, verification, automatable]
      properties:
        schema:
          type: string
          enum: [knowtation.flow_step/v0]
        step_id: { type: string }
        flow_id: { type: string }
        ordinal: { type: integer, minimum: 1 }
        owned_job: { type: string }
        instruction: { type: string }
        trigger: { type: string }
        when_not_to_run: { type: string }
        requires:
          type: array
          items:
            type: object
            required: [kind, id]
            properties:
              kind:
                type: string
                enum: [vault_scope, tool, file, artifact]
              id: { type: string }
        boundaries:
          type: array
          items: { type: string }
        skill_refs:
          type: array
          items:
            type: object
            required: [kind, id]
            properties:
              kind:
                type: string
                enum: [mcp_prompt, skill_pack, cli, external_tool]
              id: { type: string }
        inputs:
          type: array
          items:
            type: object
            required: [name, from]
            properties:
              name: { type: string }
              from: { type: string }
        outputs:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name: { type: string }
              type: { type: string }
        output_shape: { type: string }
        verification:
          type: object
          required: [kind, evidence_required, description]
          properties:
            kind:
              type: string
              enum: [human_review, artifact_exists, value_match, test_pass, agent_check]
            evidence_required: { type: boolean }
            description: { type: string }
        automatable:
          type: string
          enum: [manual, agent_assisted, automatable]
